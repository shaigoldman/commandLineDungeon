services:
  - type: web
    name: command-line-dungeon
    runtime: node
    plan: starter
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: dungeon-db
          property: connectionString
databases:
  - name: dungeon-db
    plan: basic-256mb
    databaseName: dungeon
    user: dungeon
